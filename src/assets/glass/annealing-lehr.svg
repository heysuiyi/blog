<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">玻璃杯的隧道式退火炉</title><desc id="desc">杯子沿输送带从左向右经过均温与应力松弛、受控冷却和后段冷却。下方没有刻度的温度趋势线表示先停留再降温。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#526e72"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#263e42}.h{font-size:32px;font-weight:700}.l{font-size:25px}.s{font-size:20px}</style><g id="cup"><path d="M0 0 5 70H55L60 0H51L47 60H13L9 0Z" fill="#d1e9e9" stroke="#508c96" stroke-width="2"/></g></defs>
<rect width="1200" height="680" rx="24" fill="#f8f5ed"/><text x="52" y="65" class="h">退火：杯子成形之后，安排热量逐步离开</text><text x="52" y="106" class="s">简化剖面与温度趋势 · 没有温度、时间刻度 · 不作为操作曲线</text>
<rect x="90" y="175" width="1020" height="235" rx="12" fill="#e3d7c4" stroke="#9d9386" stroke-width="3"/><rect x="110" y="196" width="310" height="188" fill="#efd1aa"/><rect x="420" y="196" width="360" height="188" fill="#f2e3cb"/><rect x="780" y="196" width="310" height="188" fill="#edf0e7"/>
<g class="l" text-anchor="middle"><text x="265" y="238">均温与应力松弛</text><text x="600" y="238">受控冷却</text><text x="935" y="238">后段冷却</text></g><g><use href="#cup" x="150" y="296"/><use href="#cup" x="290" y="296"/><use href="#cup" x="470" y="296"/><use href="#cup" x="650" y="296"/><use href="#cup" x="830" y="296"/><use href="#cup" x="1000" y="296"/></g><path d="M68 376H1135" stroke="#526e72" stroke-width="6" marker-end="url(#a)"/><text x="1120" y="445" text-anchor="end" class="s">输送方向 →</text>
<path d="M115 600V474M115 600H1090" stroke="#879794" stroke-width="2" fill="none"/><path d="M145 490H380Q435 490 475 515L680 565Q740 580 800 582L1060 590" fill="none" stroke="#cc804a" stroke-width="5"/><text x="69" y="531" class="s">较热</text><text x="69" y="598" class="s">较冷</text><text x="430" y="642" class="s">温度变化趋势（仅示意）</text>
</svg>
