<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">从配合料到玻璃杯</title><desc id="desc">从左到右展示颗粒粉料与碎玻璃、熔窑中的玻璃液、模具与冲头压制、退火后的空心杯子。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#778d8d"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#263e42}.h{font-size:34px;font-weight:700}.l{font-size:25px}.s{font-size:20px}</style></defs>
<rect width="1200" height="680" rx="24" fill="#f8f5ed"/><text x="54" y="72" class="h">玻璃：从砂粒，到能盛水的杯子</text><text x="54" y="112" class="s">材料状态与加工关系示意 · 不表示配方、尺寸或温度</text>
<g stroke="#b7c8c6" fill="#fffdf8"><rect x="45" y="160" width="250" height="400" rx="18"/><rect x="330" y="160" width="250" height="400" rx="18"/><rect x="615" y="160" width="250" height="400" rx="18"/><rect x="900" y="160" width="250" height="400" rx="18"/></g>
<g class="l" text-anchor="middle"><text x="170" y="208">配合料</text><text x="455" y="208">玻璃液</text><text x="740" y="208">压制成形</text><text x="1025" y="208">退火后的杯子</text></g>
<path d="M76 380 113 338 141 380Z" fill="#d4ba86"/><g fill="#ab8e59"><circle cx="96" cy="373" r="4"/><circle cx="111" cy="363" r="4"/><circle cx="122" cy="375" r="4"/></g><path d="M145 380 173 340 208 380Z" fill="#e8e5dd"/><path d="M212 379 228 350 248 362 238 383Z" fill="#cae4e6" stroke="#5693a1"/>
<text x="170" y="432" class="s" text-anchor="middle">砂粒 · 粉料 · 碎玻璃</text>
<path d="M365 290V393H546V290" stroke="#9b8a77" stroke-width="18" fill="none"/><path d="M376 328Q422 310 455 328T535 328V382H376Z" fill="#e9a15e"/><path d="M395 264Q403 225 425 253Q438 225 446 267" fill="none" stroke="#d77843" stroke-width="7"/><text x="455" y="432" class="s" text-anchor="middle">熔制 · 澄清 · 均化</text>
<path d="M652 281V408H827V281H803V381H676V281Z" fill="#b3b9b7"/><path d="M678 297V379H801V297H787V355H692V297Z" fill="#e9a15e"/><path d="M697 250H782V354H697Z" fill="#778887"/><path d="M740 223V242" stroke="#778d8d" stroke-width="4" marker-end="url(#arrow)"/><text x="740" y="449" class="s" text-anchor="middle">冲头与模具限定轮廓</text>
