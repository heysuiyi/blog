<g stroke="#778d8d" stroke-width="3" marker-end="url(#arrow)"><path d="M299 365H326"/><path d="M584 365H611"/><path d="M869 365H896"/></g><text x="600" y="610" class="l" text-anchor="middle">成形只是其中一步；出模之后，还需要退火和检查。</text>
