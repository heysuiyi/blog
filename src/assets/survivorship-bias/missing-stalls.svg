<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">采访名单遗漏了谁？</title>
  <desc id="desc">虚构市集起点直播80人，其中续约16人、未续约64人；不直播20人，其中续约4人、未续约16人。采访只覆盖续约的20人。箭头表示名单分流，不表示因果。</desc>
  <defs>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="7" r="0.7" fill="#fff" opacity="0.07"/><path d="M14 19h4" stroke="#fff" opacity="0.04"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4 1 7" fill="none" stroke="#efeadc" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="760" rx="20" fill="#243c38"/>
  <rect x="15" y="15" width="1170" height="730" rx="10" fill="url(#grain)" stroke="#9da99b" stroke-width="2"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#f6f0dd">
    <text x="60" y="80" font-size="38" font-weight="700">采访名单，遗漏了谁？</text>
    <text x="60" y="123" font-size="23">虚构演示 · 同一批 100 人 · 观察至第八周末</text>
    <text x="80" y="188" font-size="26">开市时的方案</text>
    <text x="505" y="188" font-size="26" fill="#b5ebce">进入采访</text>
    <text x="866" y="188" font-size="26" fill="#ffd0a7">未进入采访</text>
    <g fill="none" stroke-width="3" stroke-linecap="round">
      <rect x="60" y="225" width="260" height="126" rx="9" stroke="#efeadc"/>
      <rect x="60" y="418" width="260" height="126" rx="9" stroke="#efeadc"/>
      <rect x="465" y="213" width="290" height="348" rx="15" stroke="#b5ebce" stroke-dasharray="11 7"/>
      <rect x="825" y="213" width="300" height="348" rx="15" stroke="#ffd0a7" stroke-dasharray="11 7"/>
      <path d="M320 272H447" stroke="#efeadc" marker-end="url(#arrow)"/>
      <path d="M320 322H392V382H801V306H815" stroke="#efeadc" marker-end="url(#arrow)"/>
      <path d="M320 465H447" stroke="#efeadc" marker-end="url(#arrow)"/>
      <path d="M320 515H392V584H801V499H815" stroke="#efeadc" marker-end="url(#arrow)"/>
    </g>
    <g text-anchor="middle">
      <text x="190" y="273" font-size="27">每天直播</text><text x="190" y="320" font-size="35" font-weight="700">80 人</text>
      <text x="190" y="466" font-size="27">不直播</text><text x="190" y="513" font-size="35" font-weight="700">20 人</text>
      <g fill="#b5ebce">
        <text x="610" y="273" font-size="27">续约 16 人</text><text x="610" y="319" font-size="25">16 ÷ 80 = 20%</text>
        <text x="610" y="466" font-size="27">续约 4 人</text><text x="610" y="512" font-size="25">4 ÷ 20 = 20%</text>
      </g>
      <g fill="#ffd0a7">
        <text x="975" y="273" font-size="27">未续约 64 人</text><text x="975" y="319" font-size="23">也选择了每天直播</text>
        <text x="975" y="466" font-size="27">未续约 16 人</text><text x="975" y="512" font-size="23">选择了不直播</text>
      </g>
    </g>
    <text x="60" y="650" font-size="28" font-weight="700">续约者中八成直播 ≠ 直播者有八成续约</text>
    <text x="60" y="700" font-size="21">箭头表示名单分流，非因果关系；框面积不代表人数。</text>
  </g>
</svg>
