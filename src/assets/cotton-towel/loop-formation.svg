<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<title>三纬起圈：先留距，再将纬纱组推向织口</title>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1L8 4L1 7" fill="none" stroke="#274c5a" stroke-width="1.5"/></marker><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#274c5a" opacity=".18"/></pattern></defs>
<rect width="1200" height="850" fill="#fbf5e8"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#274c5a"><text x="60" y="65" font-size="34" font-weight="bold">先留一段距离，再把纬纱组推拢</text><text x="60" y="107" font-size="21">局部侧视动作示意 · 蓝色圆点是纬纱截面 · 棕线是毛经</text></g>
<g stroke="#274c5a" stroke-width="2" fill="url(#h)"><rect x="90" y="253" width="240" height="34"/><rect x="90" y="466" width="240" height="34"/><rect x="90" y="692" width="290" height="34"/></g>
<g fill="none" stroke="#274c5a" stroke-width="3"><path d="M330 278H1080M330 491H1080M380 717H1080"/><path d="M330 218V297M330 431V510" stroke-dasharray="5 6"/></g>
<g stroke="#aa623b" stroke-width="6" fill="none" stroke-linecap="round"><path d="M100 258H1070M100 471H1070"/><path d="M100 697H260C270 697 248 609 279 609C310 609 289 697 319 697H1070"/></g>
<g fill="#fbf5e8" stroke="#274c5a" stroke-width="4"><circle cx="647" cy="270" r="12"/><circle cx="683" cy="270" r="12"/><circle cx="647" cy="483" r="12"/><circle cx="683" cy="483" r="12"/><circle cx="719" cy="483" r="12"/><circle cx="337" cy="709" r="12"/><circle cx="373" cy="709" r="12"/><circle cx="409" cy="709" r="12"/></g>
<g fill="url(#h)" stroke="#274c5a" stroke-width="3"><rect x="749" y="225" width="18" height="74"/><rect x="784" y="438" width="18" height="74"/><rect x="443" y="660" width="18" height="78"/></g>
<g stroke="#274c5a" fill="none" stroke-width="2"><path d="M345 220H630"/><path d="M345 214V226M630 214V226"/><path d="M760 413H470" marker-end="url(#a)"/><path d="M448 585H316" marker-end="url(#a)"/></g>
<g font-family="Microsoft YaHei, sans-serif" fill="#274c5a" font-size="22">
<text x="60" y="169" font-size="25">① 前两纬：分别引入、部分打纬</text><text x="405" y="205">与织口留距</text>
<text x="145" y="330">已织好的布</text><text x="300" y="330">织口</text><text x="637" y="330">前两纬</text><text x="747" y="330">钢筘</text>
<text x="60" y="382" font-size="25">② 第三纬引入：整组推向织口</text><text x="825" y="450">毛经较松</text><text x="825" y="530">地经保持张力</text>
<text x="60" y="572" font-size="25">③ 推拢后：多出的毛经弯起</text><text x="515" y="636" fill="#aa623b">圈脚随交织固定</text><text x="515" y="676">纬纱组沿地经向布边移动</text>
<text x="60" y="795" font-size="20">只画动作关系，省略上下交织与完整织机；圈形、间距及移动量均作简化。</text>
</g></svg>
