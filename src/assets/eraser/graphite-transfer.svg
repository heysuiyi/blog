<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><title>黑色没有消失：从纸面转移到擦屑</title><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#f9d6a7"/><stop offset=".48" stop-color="#edb7a5" stop-opacity=".65"/><stop offset="1" stop-color="#e3a890"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#a9cbd2" stop-opacity=".6"/><stop offset="1" stop-color="#6e9ba9"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#516773" stroke-width="1.5"/></marker></defs><rect width="1200" height="700" fill="#fcf9f2"/><g fill="#35474f" font-family="Microsoft YaHei, sans-serif"><text x="60" y="68" font-size="34" font-weight="bold">黑色没有消失：从纸面转移到擦屑</text><text x="60" y="110" font-size="22">同一区域的三个时刻 · 纸面与颗粒放大示意</text><text x="60" y="177" font-size="25">01  石墨留在纸面</text><text x="440" y="177" font-size="25">02  接触并带走</text><text x="840" y="177" font-size="25">03  含石墨的屑脱落</text><path d="M60 410q25 -14 50 0t50 0t50 0t50 0t50 0t50 0v68h-300Z" fill="#ece1c8" stroke="#c2b69d" stroke-width="2"/><path d="M440 410q25 -14 50 0t50 0t50 0t50 0t50 0t50 0v68h-300Z" fill="#ece1c8" stroke="#c2b69d" stroke-width="2"/><path d="M840 410q25 -14 50 0t50 0t50 0t50 0t50 0t50 0v68h-300Z" fill="#ece1c8" stroke="#c2b69d" stroke-width="2"/><circle cx="82" cy="402" r="4" fill="#525358"/><circle cx="98" cy="406" r="4" fill="#525358"/><circle cx="114" cy="410" r="4" fill="#525358"/><circle cx="130" cy="402" r="4" fill="#525358"/><circle cx="146" cy="406" r="4" fill="#525358"/><circle cx="162" cy="410" r="4" fill="#525358"/><circle cx="178" cy="402" r="4" fill="#525358"/><circle cx="194" cy="406" r="4" fill="#525358"/><circle cx="210" cy="410" r="4" fill="#525358"/><circle cx="226" cy="402" r="4" fill="#525358"/><circle cx="242" cy="406" r="4" fill="#525358"/><circle cx="258" cy="410" r="4" fill="#525358"/><circle cx="274" cy="402" r="4" fill="#525358"/><circle cx="290" cy="406" r="4" fill="#525358"/><circle cx="306" cy="410" r="4" fill="#525358"/><circle cx="322" cy="402" r="4" fill="#525358"/><path d="M480 288Q580 278 680 290V405Q650 417 630 408T580 408T530 408T480 408Z" fill="url(#wash)" stroke="#c29c87" stroke-width="2"/><path d="M522 249L644 249" fill="none" stroke="#516773" stroke-width="3" marker-end="url(#arrow)"/><text x="491" y="226" font-size="20">橡皮移动方向</text><circle cx="490" cy="403" r="4" fill="#525358"/><circle cx="509" cy="406" r="4" fill="#525358"/><circle cx="528" cy="409" r="4" fill="#525358"/><circle cx="547" cy="403" r="4" fill="#525358"/><circle cx="566" cy="406" r="4" fill="#525358"/><circle cx="585" cy="409" r="4" fill="#525358"/><circle cx="604" cy="403" r="4" fill="#525358"/><circle cx="623" cy="406" r="4" fill="#525358"/><circle cx="642" cy="409" r="4" fill="#525358"/><circle cx="661" cy="403" r="4" fill="#525358"/><path d="M862 306q12 -28 37 -11t36 4t21 19q-4 18 -29 9t-32 5t-33 -26Z" fill="url(#wash)" stroke="#b58c7b"/><path d="M1008 352q10 -21 30 -12t27 16q-5 18 -26 7t-31 -11Z" fill="url(#wash)" stroke="#b58c7b"/><circle cx="879" cy="304" r="4" fill="#525358"/><circle cx="903" cy="310" r="4" fill="#525358"/><circle cx="928" cy="312" r="4" fill="#525358"/><circle cx="1025" cy="351" r="4" fill="#525358"/><circle cx="1046" cy="355" r="4" fill="#525358"/><circle cx="891" cy="409" r="4" fill="#525358"/><circle cx="1095" cy="405" r="4" fill="#525358"/><path d="M370 350L415 350" fill="none" stroke="#516773" stroke-width="3" marker-end="url(#arrow)"/><path d="M760 350L812 350" fill="none" stroke="#516773" stroke-width="3" marker-end="url(#arrow)"/><text x="78" y="516" font-size="22">笔迹：附着的细小颗粒</text><text x="462" y="516" font-size="22">接触面逐渐变黑</text><text x="863" y="516" font-size="22">纸面笔迹减淡</text><rect x="60" y="557" width="1080" height="64" rx="20" fill="#e2ebea"/><text x="89" y="598" font-size="25">橡皮表层脱落 → 石墨随擦屑移走 → 新表面继续接触纸面</text><text x="60" y="662" font-size="21">颜色与尺度均作简化 · 不表示静电吸引 · 不保证擦后完全恢复白纸</text></g></svg>