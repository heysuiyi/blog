<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><title>橡皮先成为一张板，再分成小块</title><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#f9d6a7"/><stop offset=".48" stop-color="#edb7a5" stop-opacity=".65"/><stop offset="1" stop-color="#e3a890"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#a9cbd2" stop-opacity=".6"/><stop offset="1" stop-color="#6e9ba9"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#516773" stroke-width="1.5"/></marker></defs><rect width="1200" height="700" fill="#fcf9f2"/><g fill="#35474f" font-family="Microsoft YaHei, sans-serif"><text x="60" y="68" font-size="34" font-weight="bold">橡皮先成为一张板，再分成小块</text><text x="60" y="110" font-size="22">压板路线 · 暖色是材料，蓝灰色是工具</text><text x="60" y="169" font-size="25">01  混合料装模</text><text x="440" y="169" font-size="25">02  压板成形</text><text x="845" y="169" font-size="25">03  板坯裁切</text><path d="M65 260V355H330V260H305V330H90V260Z" fill="url(#blue)" stroke="#688792" stroke-width="2"/><path d="M93 327V298Q126 275 152 297T215 289T302 300V327Z" fill="url(#wash)"/><path d="M145 208Q200 192 245 208L237 237Q190 226 151 237Z" fill="url(#wash)"/><path d="M198 242L198 276" fill="none" stroke="#516773" stroke-width="3" marker-end="url(#arrow)"/><text x="93" y="392" font-size="23">板状模具中的混合料</text><path d="M443 279V355H713V279H688V330H468V279Z" fill="url(#blue)" stroke="#688792" stroke-width="2"/><rect x="470" y="298" width="216" height="30" rx="3" fill="url(#wash)"/><rect x="466" y="252" width="222" height="46" rx="3" fill="url(#blue)"/><rect x="554" y="199" width="48" height="53" fill="url(#blue)"/><path d="M500 205L500 241" fill="none" stroke="#516773" stroke-width="3" marker-end="url(#arrow)"/><path d="M655 205L655 241" fill="none" stroke="#516773" stroke-width="3" marker-end="url(#arrow)"/><text x="452" y="392" font-size="23">上方施压，模内形成整板</text><path d="M351 303L415 303" fill="none" stroke="#516773" stroke-width="3" marker-end="url(#arrow)"/><path d="M742 303L805 303" fill="none" stroke="#516773" stroke-width="3" marker-end="url(#arrow)"/><path d="M841 271L1063 243L1126 284L902 314Z" fill="url(#wash)" stroke="#bd927e" stroke-width="2"/><path d="M902 314L1126 284V320L902 350Z" fill="#e4b49b"/><path d="M841 271L902 314V350L841 307Z" fill="#f1d4b9"/><path d="M914 262L974 304M987 253L1048 294M873 292L1095 263" stroke="#835f53" stroke-width="2" stroke-dasharray="6 6"/><path d="M943 201L1004 242L1004 270L943 229Z" fill="url(#blue)"/><path d="M1028 206L1028 246" fill="none" stroke="#516773" stroke-width="3" marker-end="url(#arrow)"/><text x="853" y="392" font-size="23">达到可裁切状态后分块</text><rect x="60" y="455" width="1080" height="165" rx="25" fill="#eef1e7"/><rect x="107" y="496" width="230" height="74" rx="7" fill="url(#wash)" stroke="#c59881"/><rect x="158" y="493" width="125" height="80" rx="3" fill="url(#blue)"/><text x="375" y="518" font-size="27">小块橡皮 + 纸套 = 待包装的成品</text><text x="375" y="560" font-size="23">纸套最后装，不参与加热压板。</text><text x="60" y="662" font-size="21">结构简化示意 · 省略脱模与温度调节 · 虚线为切分位置，并非裂缝</text></g></svg>