<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><title>泥浆怎样在石膏模里留下空心碗</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#508c9d"/></marker></defs><rect width="1200" height="680" rx="28" fill="#faf7f1"/><g font-family="Microsoft YaHei, sans-serif" fill="#30494a"><text x="60" y="70" font-size="38">一盆浆，怎样留下一个空心壳？</text><text x="60" y="112" font-size="23">石膏模排浆注浆 · 纵向剖面示意</text><g transform="translate(65 220)"><path d="M0 -20H45V0Q65 155 150 155Q235 155 255 0V-20H300V210H0Z" fill="#e5dac5"/><path d="M45 0H255Q235 155 150 155Q65 155 45 0Z" fill="#96b6c3"/></g><text x="65" y="175" font-size="27">1  注入泥浆</text><text x="65" y="480" font-size="24">腔内装满流动的浆</text><g transform="translate(455 220)"><path d="M0 -20H45V0Q65 155 150 155Q235 155 255 0V-20H300V210H0Z" fill="#e5dac5"/><path d="M45 0 Q65 155 150 155 Q235 155 255 0 L234 0 Q215 131 150 131 Q85 131 66 0Z" fill="#c48765"/><path d="M66 0H234Q215 131 150 131Q85 131 66 0Z" fill="#96b6c3"/></g><text x="455" y="175" font-size="27">2  靠壁形成湿坯层</text><text x="455" y="480" font-size="24">水进入模具，颗粒留下</text><g transform="translate(845 220)"><path d="M0 -20H45V0Q65 155 150 155Q235 155 255 0V-20H300V210H0Z" fill="#e5dac5"/><path d="M45 0 Q65 155 150 155 Q235 155 255 0 L234 0 Q215 131 150 131 Q85 131 66 0Z" fill="#c48765"/></g><text x="845" y="175" font-size="27">3  排出余浆后</text><text x="845" y="480" font-size="24">中央空了，薄壳留下</text><path d="M505 275L470 300" fill="none" stroke="#508c9d" stroke-width="4" marker-end="url(#arrow)"/><path d="M705 275L740 300" fill="none" stroke="#508c9d" stroke-width="4" marker-end="url(#arrow)"/><path d="M605 365L605 410" fill="none" stroke="#508c9d" stroke-width="4" marker-end="url(#arrow)"/><text x="505" y="523" font-size="22">蓝箭头：水分移动</text><text x="965" y="285" font-size="27">空腔</text><rect x="70" y="560" width="24" height="24" fill="#e5dac5"/><text x="108" y="581" font-size="24">石膏模</text><rect x="270" y="560" width="24" height="24" fill="#96b6c3"/><text x="308" y="581" font-size="24">流动泥浆</text><rect x="500" y="560" width="24" height="24" fill="#c48765"/><text x="538" y="581" font-size="24">湿坯层</text><text x="70" y="632" font-size="21">AI 辅助 SVG 示意 · 壁厚放大 · 右图是排浆后状态，实际须倾斜模具</text></g></svg>