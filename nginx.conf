server {
    listen 80;
    server_name putl.online;
    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates at the public proxy. Keep directory redirects relative
    # so an HTTPS request never becomes an HTTP URL on this internal listener.
    absolute_redirect off;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Preserve HTTP 404 while serving the built Astro error page.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Hidden project files must never be served, even if copied into dist.
    location ~ /\. {
        deny all;
    }
}
